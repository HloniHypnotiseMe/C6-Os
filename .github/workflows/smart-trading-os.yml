name: C6 Smart Trading OS

on:
  push:
    paths:
      - "products/smart-trading-os/**"
      - ".github/workflows/smart-trading-os.yml"
  pull_request:
    paths:
      - "products/smart-trading-os/**"
      - ".github/workflows/smart-trading-os.yml"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r products/smart-trading-os/requirements-dev.txt
      - run: python -m pytest products/smart-trading-os/tests -q
