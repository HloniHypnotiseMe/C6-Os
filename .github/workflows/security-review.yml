name: Security Review Scans

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-security-audit:
    name: Gitleaks + Semgrep + Trivy (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create report directory
        run: mkdir -p security-review-reports

      - name: Scan Git history for exposed secrets
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            git --redact --report-format json \
            --report-path /repo/security-review-reports/gitleaks.json \
            /repo

      - name: Scan source for security weaknesses
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            semgrep/semgrep:1.99.0 \
            scan --config p/security-audit \
            --json --output /repo/security-review-reports/semgrep.json \
            /repo

      - name: Scan dependencies, secrets and configuration
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            aquasec/trivy:0.58.2 \
            fs --scanners vuln,misconfig,secret \
            --severity CRITICAL,HIGH \
            --format json \
            --output /repo/security-review-reports/trivy.json \
            /repo

      - name: Upload private security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-${{ github.event.pull_request.number || github.run_id }}
          path: security-review-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: State scan limitations
        if: always()
        run: |
          echo "Automated findings are evidence for triage, not a security certification."
          echo "This workflow does not perform dynamic testing, authorization testing, penetration testing, or production scans."
          echo "Review scanner exit codes and reports before treating this run as complete."
