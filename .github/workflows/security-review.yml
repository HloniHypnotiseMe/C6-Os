name: Security Review Scans

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-security-audit:
    name: Gitleaks + Semgrep + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create report directory
        run: mkdir -p security-review-reports

      - name: Scan Git history for exposed secrets
        id: gitleaks
        if: always()
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            git --redact --exit-code 0 --report-format json \
            --report-path /repo/security-review-reports/gitleaks.json \
            /repo

      - name: Scan source for security weaknesses
        id: semgrep
        if: always()
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            semgrep/semgrep:1.184.0 \
            semgrep scan --config p/security-audit \
            --json --output /repo/security-review-reports/semgrep.json \
            /repo

      - name: Scan dependencies, secrets and configuration
        id: trivy
        if: always()
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            aquasec/trivy:0.76.2 \
            fs --scanners vuln,misconfig,secret \
            --severity CRITICAL,HIGH \
            --format json \
            --output /repo/security-review-reports/trivy.json \
            /repo

      - name: Upload private security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-${{ github.event.pull_request.number || github.run_id }}
          path: security-review-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize scanner execution
        if: always()
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          {
            echo "## Security scanner execution"
            echo "- Gitleaks execution: $GITLEAKS_OUTCOME (findings are in the report; this is not a clean bill of health)"
            echo "- Semgrep execution: $SEMGREP_OUTCOME"
            echo "- Trivy execution: $TRIVY_OUTCOME"
            echo "- Reports are private artifacts retained for 14 days."
            echo "- This workflow is static analysis only; it is not a penetration test or independent security certification."
          } >> "$GITHUB_STEP_SUMMARY"
