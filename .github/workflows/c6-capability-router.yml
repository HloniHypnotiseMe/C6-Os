name: C6 Capability Router Tests

on:
  push:
    branches: ["main", "feat/c6-capability-router"]
    paths:
      - "START-HERE.md"
      - "agent-arsenal/router/**"
      - "agent-arsenal/workflows/**"
      - "agent-arsenal/mcp-server/**"
      - "agent-arsenal/registry/**"
      - "agent-arsenal/tests/**"
      - ".github/workflows/c6-capability-router.yml"
  pull_request:
    paths:
      - "START-HERE.md"
      - "agent-arsenal/router/**"
      - "agent-arsenal/workflows/**"
      - "agent-arsenal/mcp-server/**"
      - "agent-arsenal/registry/**"
      - "agent-arsenal/tests/**"
      - ".github/workflows/c6-capability-router.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-arsenal/mcp-server/package-lock.json
      - name: Install Arsenal MCP dependencies
        working-directory: agent-arsenal/mcp-server
        run: npm ci
      - name: Run Capability Router tests
        run: node agent-arsenal/router/test-router.mjs
      - name: Run Specialist Registry tests
        run: node agent-arsenal/tests/test-specialist-registry.mjs
      - name: Run START HERE gate tests
        run: node agent-arsenal/tests/test-start-here-gate.mjs
      - name: Run Department View tests
        run: node agent-arsenal/tests/test-department-view.mjs
      - name: Run Build Entry tests
        run: node agent-arsenal/tests/test-build-entry.mjs
      - name: Run Company Operating Model tests
        run: node agent-arsenal/tests/test-company-operating-model.mjs
