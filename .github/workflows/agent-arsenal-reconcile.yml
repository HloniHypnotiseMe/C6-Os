name: Agent Arsenal Reconciliation
# Cross-repository credential gate verified by C6_GITHUB_TOKEN
# Verification trigger: repository secret has been provisioned.
# Credential refresh verification trigger.
on:
  workflow_dispatch:
  push:
    paths:
      - 'agent-arsenal/universal/reconcile-github-profile.mjs'
      - 'agent-arsenal/universal/reconcile-registry.mjs'
      - 'agent-arsenal/universal/enrich-repository-evidence.mjs'
      - '.github/workflows/agent-arsenal-reconcile.yml'
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select cross-repository GitHub credential
        env:
          C6_GITHUB_TOKEN: ${{ secrets.C6_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$C6_GITHUB_TOKEN" ]; then
            echo "Using C6_GITHUB_TOKEN for cross-repository Arsenal access."
            echo "C6_RECONCILE_TOKEN=$C6_GITHUB_TOKEN" >> "$GITHUB_ENV"
          else
            echo "C6_GITHUB_TOKEN is not configured; falling back to repository-scoped GITHUB_TOKEN."
            echo "C6_RECONCILE_TOKEN=$GITHUB_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Reconcile GitHub repository inventory
        env:
          GITHUB_TOKEN: ${{ env.C6_RECONCILE_TOKEN }}
          GITHUB_OWNER: HloniHypnotiseMe
        run: node agent-arsenal/universal/reconcile-github-profile.mjs

      - name: Reconcile categorized repository registry
        run: node agent-arsenal/universal/reconcile-registry.mjs

      - name: Enrich repository capability evidence
        env:
          GITHUB_TOKEN: ${{ env.C6_RECONCILE_TOKEN }}
          GITHUB_OWNER: HloniHypnotiseMe
        run: node agent-arsenal/universal/enrich-repository-evidence.mjs

      - name: Commit inventory refresh when changed
        run: |
          git config user.name 'c6-agent-arsenal-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent-arsenal/universal/inventory-snapshot.json agent-arsenal/universal/capability-diff.json agent-arsenal/universal/repository-registry.yaml agent-arsenal/universal/repository-evidence.json
          if git diff --cached --quiet; then
            echo 'No inventory changes.'
          else
            git commit -m 'chore: refresh Arsenal inventory'
            git push
          fi
