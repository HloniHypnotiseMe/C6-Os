name: Agent Arsenal Reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent-arsenal/universal/reconcile-github-profile.mjs'
      - 'agent-arsenal/universal/reconcile-registry.mjs'
      - 'agent-arsenal/universal/enrich-repository-evidence.mjs'
      - '.github/workflows/agent-arsenal-reconcile.yml'
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconcile GitHub repository inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: HloniHypnotiseMe
        run: node agent-arsenal/universal/reconcile-github-profile.mjs

      - name: Reconcile categorized repository registry
        run: node agent-arsenal/universal/reconcile-registry.mjs

      - name: Enrich repository capability evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: HloniHypnotiseMe
        run: node agent-arsenal/universal/enrich-repository-evidence.mjs

      - name: Commit inventory refresh when changed
        run: |
          git config user.name 'c6-agent-arsenal-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent-arsenal/universal/inventory-snapshot.json agent-arsenal/universal/capability-diff.json agent-arsenal/universal/repository-registry.yaml agent-arsenal/universal/repository-evidence.json
          if git diff --cached --quiet; then
            echo 'No inventory changes.'
          else
            git commit -m 'chore: reconcile Agent Arsenal repository inventory'
            git push
          fi
