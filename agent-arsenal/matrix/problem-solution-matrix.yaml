rows:
  - pain_id: NO_WEBSITE
    pain: "Business has no owned website or digital home."
    evidence_required: "Business submission says no website and public search confirms no owned domain/site."
    impact_category: Visibility
    ai_can_fix: true
    capability: website_creation
    provider: c6group_website
    adapter: c6-website
    adapter_status: missing
    package: Foundation
    confidence: medium
    gap: "Implement verified website creation/optimization adapter and business-specific evidence checks."
    evidence_source: "audit_input + public_web"
    evidence_strength: "candidate"
    evidence_date: "2026-09-19"
    evidence_population: "individual audited business"
    validation_status: hypothesis
    success_role: Growth Coach
    success_intervention: "Recommend and, once activated and authorized, execute digital-home build."

