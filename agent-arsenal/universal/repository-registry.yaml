schema_version: "1.0"
registry_id: c6-universal-agent-arsenal
purpose: "Universal quick-reference for C6-Os, C6Group.AiOS, and connected C6 agents."
source: "HloniHypnotiseMe GitHub profile fork inventory + C6 internal repositories"
last_reconciled: "2026-09-17"

rules:
  - "Consult this registry before building, installing, or selecting a provider."
  - "Capability first; provider second; adapter third; execution last."
  - "Fork presence means reference availability, not production approval."
  - "Prefer existing C6 adapters and smallest suitable service/worker."
  - "Pin production dependencies after license, security, maintenance, and runtime review."
  - "Never store credentials, tokens, private keys, or secrets here."
  - "High-risk, financial, destructive, privacy-sensitive, or external-send actions require policy/approval checks."

systems:
  c6_os:
    role: "Governance, discovery, orchestration, adapters, policies, workflows"
