  tier_b: "Strong capability candidate requiring integration and validation"
  tier_c: "Reference/future/specialist; do not activate without a concrete requirement"

agent_protocol:
  discover: "Resolve capability in this registry and the detailed provider registry."
  validate: "Check permissions, risk, license, version/pin, runtime, health, data handling."
  select: "Choose the smallest suitable provider and adapter."
  execute: "Use minimum permissions; require approval for consequential actions."
  verify: "Confirm outcome independently where practical."
  remember: "Store durable execution knowledge in the approved memory system."
  report: "Return provider, adapter, action, outcome, and relevant evidence."

security_notes:
  - "Security scanners and offensive-security repositories are defensive/authorized-use references only."
  - "Financial/trading repositories are research or controlled integrations until separately approved."
