schema_version: "1.0"
date: "2026-10-02"
purpose: "Machine-readable final-mile closure register. Repository closure is never substituted for external/runtime evidence."

status_semantics:
  closed: "Repository/control-plane implementation or reconciliation is complete."
  blocked_external: "No code-only change can truthfully produce the required evidence; external account/provider/runtime action is required."
  not_implemented: "Capability is intentionally not built yet."
  partial: "Some implementation exists but the production contract is incomplete."

