status_semantics:
  exists: "Repository/code is present."
  works: "Execution has been demonstrated successfully."
  verified: "Execution/test/runtime evidence has been recorded for the relevant claim."
  live: "Production runtime and external routing have been directly verified."
  fork: "GitHub repository is a fork/upstream-derived copy and is not automatically the C6 source of truth."

source_of_truth_rule:
  - "C6-owned repositories are the primary internal source of truth."
  - "Controlled forks must be inspected before replacing, upstreaming, or duplicating functionality."
  - "Do not infer production status from repository existence."
  - "Do not invent pins, credentials, endpoints, or runtime health."

