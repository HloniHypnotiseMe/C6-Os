schema_version: "0.1"
capabilities:
  - id: project_execution
    purpose: "Structure complex software work into explicit requirements, plans, execution units, context preparation, and verification."
    providers: [get_shit_done, c6_os]
  - id: context_engineering
    purpose: "Prepare bounded, relevant execution context so agents work from explicit project state instead of rediscovering it repeatedly."
    providers: [get_shit_done, context_hub, openviking, c6_os]
  - id: spec_driven_development
    purpose: "Turn objectives into explicit specifications, plans, acceptance conditions, and implementation checkpoints."
    providers: [get_shit_done, c6_os]
  - id: development_workflow
    purpose: "Provide reusable development workflow patterns for inspect, plan, execute, test, and verify cycles."
    providers: [get_shit_done, c6_os]
  - id: verification_workflow
    purpose: "Structure execution around explicit verification and completion evidence."
    providers: [get_shit_done, c6_os]
  - id: product_catalog_resolution
    purpose: "Resolve C6 products, domain owners, platform consumers, and capability boundaries."
    providers: [c6_os]
  - id: claim_evidence
    purpose: "Map customer-facing claims to evidence contracts, evidence records, and verification status."
    providers: [c6_os, c6_saas_core]
  - id: tax_services
    purpose: "Provide tax product workflows and evidence-backed outcomes."
    providers: [remote_pay_holdings]
  - id: secretarial_services
    purpose: "Provide secretarial/corporate governance product workflows and evidence-backed outcomes."
    providers: [remote_pay_holdings]
  - id: payments
    purpose: "Create, verify, reconcile, and settle payment transactions."
    providers: [remotepay]
  - id: multi_agent_orchestration
    purpose: "Coordinate multiple specialist agents toward one objective."
    providers: [clawteam, metagpt, crewai_examples, goose, hf_agents]
  - id: specialist_agents
    purpose: "Select reusable role-based specialist agents."
    providers: [agency_agents, hf_agents]
  - id: agent_memory
    purpose: "Persist and retrieve agent context and long-lived knowledge."
    providers: [openviking, context_hub]
  - id: context_retrieval
    purpose: "Resolve relevant documentation and knowledge before execution."
    providers: [context_hub, openviking]
  - id: research
    purpose: "Conduct structured research using reusable agent and knowledge resources."
    providers: [context_hub, openviking, metagpt, hf_agents, openmaic]
  - id: coding_agent_orchestration
    purpose: "Coordinate coding agents, subagents, and development workflows."
    providers: [oh_my_codex, goose, metagpt]
  - id: development_automation
    purpose: "Automate repeatable software-engineering work."
    providers: [oh_my_codex, goose]
  - id: browser_automation
    purpose: "Drive browser-based tasks and web interfaces."
    providers: [headlessx, page_agent]
  - id: web_scraping
    purpose: "Collect and transform public web data."
    providers: [scrapling]
  - id: page_understanding
    purpose: "Understand and act on page-level interfaces."
    providers: [page_agent]
  - id: sandbox_execution
    purpose: "Run untrusted or isolated workloads in controlled environments."
    providers: [opensandbox]
  - id: code_interpreter
    purpose: "Execute code in an isolated execution environment."
    providers: [opensandbox]
  - id: financial_research
    purpose: "Perform structured market and financial research."
    providers: [tradingagents]
    risk: high
  - id: trading_analysis
    purpose: "Support quantitative/trading analysis workflows."
    providers: [tradingagents]
    risk: high
  - id: workflow_automation
    purpose: "Connect events, APIs, business processes, and actions."
    providers: [n8n, diesel_connect]
  - id: scheduling
    purpose: "Coordinate bookings, availability, and scheduling workflows."
    providers: [calcom]
  - id: document_signing
    purpose: "Run digital document signing workflows."
    providers: [documenso, docuseal]
  - id: self_hosted_deployment
    purpose: "Deploy and operate self-hosted applications."
    providers: [coolify]
  - id: backend_services
    purpose: "Provide database, auth, storage, and application backend primitives."
    providers: [supabase]
  - id: database_ui
    purpose: "Expose operational data through configurable database interfaces."
    providers: [nocodb]
  - id: analytics
    purpose: "Measure product and web behavior."
    providers: [posthog, plausible]
  - id: design_collaboration
    purpose: "Create and collaborate on visual product designs."
    providers: [penpot, excalidraw]
  - id: media_management
    purpose: "Manage self-hosted photo and media libraries."
    providers: [immich]
  - id: knowledge_management
    purpose: "Organize reusable business and operational knowledge."
    providers: [appflowy, context_hub]
  - id: email_marketing
    purpose: "Manage lists and outbound email campaigns."
    providers: [listmonk]
  - id: repository_drift_forensics
    purpose: "Inspect repositories, trace real execution paths, and detect implementation drift before changes."
    providers: [c6_os]
  - id: workflow_architecture
    purpose: "Recover workflows, state transitions, failure paths, and handoff contracts from implementation."
    providers: [c6_os]
  - id: evidence_based_qa
    purpose: "Verify claims and acceptance criteria against reproducible implementation and runtime evidence."
    providers: [c6_os]
  - id: production_reality_check
    purpose: "Cross-check production-readiness claims against actual implementation and evidence."
    providers: [c6_os]
  - id: company_operating_model
    purpose: "Define the business functions, workforce layers, systems, permissions, evidence, exceptions, and wins required for a product to operate like a company."
    providers: [c6_os]
  - id: api_contract_engineering
    purpose: "Design and verify stable API contracts, compatibility, idempotency, versioning, and documentation."
    providers: [c6_os]

  - id: repository_onboarding
    purpose: "Trace an unfamiliar repository from entry points through dependencies and execution paths."
    providers: [c6_os]

  - id: database_reliability
    purpose: "Verify database migration safety, backups, restore paths, connections, and disaster recovery."
    providers: [c6_os]

  - id: development_tooling
    purpose: "Improve reproducible developer tooling, CI automation, and development workflows."
    providers: [c6_os]

  - id: software_architecture
    purpose: "Define system boundaries, dependencies, architecture decisions, and trade-offs."
    providers: [c6_os]

  - id: ai_generated_code_security
    purpose: "Audit AI-generated code for insecure patterns, prompt injection exposure, and supply-chain risk."
    providers: [c6_os]

  - id: application_security
    purpose: "Perform threat modeling, secure code review, authentication review, and dependency-risk analysis."
    providers: [c6_os]

  - id: security_architecture
    purpose: "Map security controls, data flows, architecture threats, and required mitigations."
    providers: [c6_os]

  - id: authorized_security_testing
    purpose: "Perform explicitly authorized security testing and remediation retesting."
    providers: [c6_os]

  - id: security_operations
    purpose: "Monitor runtime security signals, triage incidents, and document containment."
    providers: [c6_os]

  - id: api_testing
    purpose: "Test API contracts, endpoints, authentication, negative paths, and compatibility."
    providers: [c6_os]

  - id: performance_verification
    purpose: "Measure performance baselines, load behaviour, bottlenecks, and regressions."
    providers: [c6_os]

  - id: e2e_test_automation
    purpose: "Automate deterministic end-to-end tests with isolated fixtures and CI evidence."
    providers: [c6_os]
  - id: mail_server
    purpose: "Provide self-hosted SMTP, submission, IMAP/POP3 mailboxes, filtering, and mail administration."
    providers: [billionmail]
  - id: binary_executable_analysis
    purpose: "Analyze compiled executables and binaries through disassembly, decompilation, graphing, scripting, and format-aware inspection."
    providers: [ghidra, reverse_skill, idassist]
    risk: high
  - id: malware_analysis
    purpose: "Perform authorized malware and malicious-code analysis using controlled reverse-engineering workflows and evidence capture."
    providers: [reverse_skill, ghidra, idassist]
    risk: high
  - id: protocol_network_reverse_engineering
    purpose: "Reverse engineer authorized network protocols, request flows, traffic captures, and application communication behaviour."
    providers: [reverse_skill, idassist]
    risk: high
  - id: application_api_reverse_engineering
    purpose: "Analyze authorized application, API, mobile, JavaScript, and client-side behaviour to recover implementation and protocol logic."
    providers: [reverse_skill, idassist]
    risk: high
  - id: firmware_embedded_analysis
    purpose: "Analyze authorized firmware, IoT, embedded binaries, images, and processor-specific code."
    providers: [reverse_skill, ghidra]
    risk: high
  - id: decompilation_disassembly
    purpose: "Convert compiled code into assembly and higher-level representations for authorized software analysis."
    providers: [ghidra, idassist, reverse_skill]
    risk: high
  - id: vulnerability_research_reverse
    purpose: "Support authorized vulnerability research by combining reverse engineering, code analysis, evidence capture, and controlled validation."
    providers: [reverse_skill, idassist, ghidra]
    risk: high
  - id: digital_forensics_reverse
    purpose: "Support authorized forensic examination of binaries, artifacts, and execution evidence where reverse engineering is required."
    providers: [ghidra, reverse_skill, idassist]
    risk: high
