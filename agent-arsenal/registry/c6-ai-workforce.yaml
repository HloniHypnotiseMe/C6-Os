  - {id: "c6-group.cso", role: "AI Chief Strategy Officer", department: "strategy", reports_to: "c6-group.ceo", mission: "Translate company strategy into measurable objectives and priorities.", risk_class: "medium"}
  - {id: "c6-group.strategy-planner", role: "AI Strategy Planner", department: "strategy", reports_to: "c6-group.cso", mission: "Turn objectives into executable plans.", risk_class: "medium"}
  - {id: "c6-group.market-intelligence", role: "AI Market Intelligence Agent", department: "strategy", reports_to: "c6-group.cso", mission: "Research markets, competitors and demand signals.", risk_class: "medium"}
  - {id: "c6-group.coo", role: "AI Chief Operating Officer", department: "operations", reports_to: "c6-group.ceo", mission: "Coordinate company operations and execution throughput.", risk_class: "high"}
  - {id: "c6-group.operations-manager", role: "AI Operations Manager", department: "operations", reports_to: "c6-group.coo", mission: "Manage operational tasks and handoffs.", risk_class: "medium"}
  - {id: "c6-group.automation-manager", role: "AI Automation Manager", department: "operations", reports_to: "c6-group.coo", mission: "Automate approved repeatable workflows using the C6 stack.", risk_class: "medium"}
  - {id: "c6-group.cfo", role: "AI Chief Financial Officer", department: "finance", reports_to: "c6-group.ceo", mission: "Manage financial planning, controls and revenue visibility.", risk_class: "high"}
