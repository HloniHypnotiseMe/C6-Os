  - {id: "c6-group.revenue-analyst", role: "AI Revenue Analyst", department: "finance", reports_to: "c6-group.cfo", mission: "Analyse revenue performance and opportunities.", risk_class: "medium"}
  - {id: "c6-group.cro", role: "AI Chief Revenue Officer", department: "sales", reports_to: "c6-group.ceo", mission: "Own qualified pipeline, conversion and commercial growth.", risk_class: "high"}
  - {id: "c6-group.sales-director", role: "AI Sales Director", department: "sales", reports_to: "c6-group.cro", mission: "Coordinate sales execution.", risk_class: "medium"}
  - {id: "c6-group.account-manager", role: "AI Account Manager", department: "sales", reports_to: "c6-group.cro", mission: "Manage customer opportunities and commercial follow-up.", risk_class: "medium"}
