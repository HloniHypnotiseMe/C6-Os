  - {id: "c6-group.product-manager", role: "AI Product Manager", department: "product", reports_to: "c6-group.cpo", mission: "Manage product objectives and delivery priorities.", risk_class: "medium"}
  - {id: "c6-group.bundle-designer", role: "AI Bundle Designer", department: "product", reports_to: "c6-group.cpo", mission: "Design product bundles using verified capabilities.", risk_class: "medium"}
  - {id: "c6-group.product-auditor", role: "AI Product Auditor", department: "product", reports_to: "c6-group.cpo", mission: "Check product claims against evidence contracts.", risk_class: "medium"}
  - {id: "c6-group.cto", role: "AI Chief Technology Officer", department: "technology", reports_to: "c6-group.ceo", mission: "Own technical execution, reliability and platform integration.", risk_class: "high"}
  - {id: "c6-group.platform-engineer", role: "AI Platform Engineer", department: "technology", reports_to: "c6-group.cto", mission: "Integrate C6 products with shared self-hosted platform capabilities.", risk_class: "high"}
  - {id: "c6-group.qa-engineer", role: "AI QA Engineer", department: "technology", reports_to: "c6-group.cto", mission: "Validate product workflows and evidence gates.", risk_class: "medium"}
  - {id: "c6-group.deployment-engineer", role: "AI Deployment Engineer", department: "technology", reports_to: "c6-group.cto", mission: "Deploy and verify approved changes on C6 infrastructure.", risk_class: "high"}
  - {id: "c6-group.cco", role: "AI Chief Customer Officer", department: "customer_success", reports_to: "c6-group.ceo", mission: "Own onboarding, support and customer outcome evidence.", risk_class: "high"}
  - {id: "c6-group.onboarding-manager", role: "AI Onboarding Manager", department: "customer_success", reports_to: "c6-group.cco", mission: "Move customers from purchase to successful onboarding.", risk_class: "medium"}
  - {id: "c6-group.support-manager", role: "AI Support Manager", department: "customer_success", reports_to: "c6-group.cco", mission: "Resolve customer support workflows and escalate exceptions.", risk_class: "medium"}
  - {id: "c6-group.customer-evidence", role: "AI Customer Evidence Agent", department: "customer_success", reports_to: "c6-group.cco", mission: "Capture customer outcome evidence without fabricating results.", risk_class: "medium"}
  - {id: "c6-group.risk-officer", role: "AI Chief Risk & Compliance Officer", department: "risk_compliance", reports_to: "c6-group.ceo", mission: "Challenge company execution, monitor controls and escalate risk.", risk_class: "critical"}
  - {id: "c6-group.risk-liaison", role: "AI Risk Liaison", department: "risk_compliance", reports_to: "c6-group.risk-officer", mission: "Route material risks to Holding Risk & Inversion.", risk_class: "critical"}
  - {id: "c6-group.compliance-auditor", role: "AI Compliance Auditor", department: "risk_compliance", reports_to: "c6-group.risk-officer", mission: "Audit claims, controls and evidence status.", risk_class: "high"}

governance:
  control_plane: "c6-saas-core"
  arsenal: "C6-Os"
  payment_truth: "RemotePay-"
  mail_service: "C6-Mail-Services"
  evidence_rule: "CAPTURE -> PROVE -> REGISTER -> ESCALATE"
  status_rule: "EXISTS != WORKS != VERIFIED != LIVE"
  extraction_contract: "agent-arsenal/governance/C6-CAPABILITY-EXTRACTION-CONTRACT.yaml"
  extraction_manifest: "agent-arsenal/workforce/c6-group/AGENCY-EXTRACTION-MANIFEST.yaml"
