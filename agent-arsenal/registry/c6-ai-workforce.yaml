schema_version: "1.1"
company:
  id: c6_group
  name: "C6 Group"
  repo: "C6-Group-Final-Website"
  ceo: "c6-group.ceo"
authority: "AI workforce operates within delegated C6 SaaS Core controls; human Board retains ultimate authority and escalation."
agents:
