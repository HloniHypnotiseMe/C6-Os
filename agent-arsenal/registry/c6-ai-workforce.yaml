  - {id: "c6-group.outbound-strategist", role: "AI Outbound Strategist", department: "sales", reports_to: "c6-group.sales-director", mission: "Turn verified buying signals into qualified C6 pipeline using evidence-backed targeted outreach.", risk_class: "medium", source: "agency-agents/sales/sales-outbound-strategist.md", definition: "agent-arsenal/workforce/c6-group/outbound-strategist.md"}
  - {id: "c6-group.cmo", role: "AI Chief Marketing Officer", department: "marketing", reports_to: "c6-group.ceo", mission: "Grow C6 Group visibility, demand and qualified inbound opportunities.", risk_class: "high"}
  - {id: "c6-group.seo-analyst", role: "AI SEO Agent", department: "marketing", reports_to: "c6-group.cmo", mission: "Improve discoverability across search and agent-readable business surfaces.", risk_class: "medium", source: "agency-agents/marketing/marketing-seo-specialist.md", definition: "agent-arsenal/workforce/c6-group/seo-analyst.md"}
  - {id: "c6-group.content-manager", role: "AI Content Agent", department: "marketing", reports_to: "c6-group.cmo", mission: "Create evidence-grounded commercial content.", risk_class: "medium", source: "agency-agents/marketing/marketing-content-creator.md", definition: "agent-arsenal/workforce/c6-group/content-manager.md"}
  - {id: "c6-group.social-manager", role: "AI Social Agent", department: "marketing", reports_to: "c6-group.cmo", mission: "Distribute approved C6 content through connected channels.", risk_class: "medium", source: "agency-agents/marketing/marketing-social-media-strategist.md", definition: "agent-arsenal/workforce/c6-group/social-manager.md"}
  - {id: "c6-group.growth-experimenter", role: "AI Growth Experimenter", department: "marketing", reports_to: "c6-group.cmo", mission: "Design and measure bounded growth experiments for acquisition, activation, retention or referral.", risk_class: "medium", source: "agency-agents/marketing/marketing-growth-hacker.md", definition: "agent-arsenal/workforce/c6-group/growth-experimenter.md"}
  - {id: "c6-group.agent-visibility", role: "AI Agent Visibility Agent", department: "marketing", reports_to: "c6-group.cmo", mission: "Make C6 and customer businesses understandable and actionable to AI agents.", risk_class: "medium"}
